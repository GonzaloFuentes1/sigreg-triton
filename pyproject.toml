[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "sigreg-triton"
version = "0.1.0"
description = "Fused Triton forward/backward kernels for SIGReg, the sliced Epps-Pulley regularizer of LeJEPA"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Gonzalo Fuentes" }]
dependencies = ["torch>=2.1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
bench = ["matplotlib>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/sigreg_triton"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires a CUDA device and Triton"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
